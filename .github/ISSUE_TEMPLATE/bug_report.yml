name: Ошибка
description: Сообщить о воспроизводимой ошибке IslandVolt
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не включайте в отчёт секреты, токены и личные данные.
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что нужно сделать, чтобы увидеть проблему?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Версия и сборка Windows, версия/commit IslandVolt, DPI и мониторы.
    validations:
      required: true
