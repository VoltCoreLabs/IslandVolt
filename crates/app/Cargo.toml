[package]
name = "islandvolt-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
islandvolt-platform-windows = { path = "../platform-windows" }
islandvolt-features = { path = "../features" }

[dev-dependencies]
resvg = "0.45"
